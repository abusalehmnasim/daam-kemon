# Note: DATABASE_URL is intentionally NOT managed by this blueprint. It is set
# manually in the Render dashboard (Environment tab) to the Supabase connection
# string, so a blueprint sync can never overwrite it with a different database.
services:
  - type: redis
    name: daamkemon-redis
    plan: free
    ipAllowList: [] # Only allow internal connections

  - type: web
    name: daamkemon-api
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        sync: false # set in the dashboard to the Supabase connection string
      - key: REDIS_URL
        fromService:
          type: redis
          name: daamkemon-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: ADMIN_API_KEY
        sync: false # set in the dashboard to a strong secret

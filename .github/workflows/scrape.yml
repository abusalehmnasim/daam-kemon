name: Scrape prices

on:
  schedule:
    # 01:00 UTC daily = ~07:00 Asia/Dhaka. Fresh prices each morning.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      store:
        description: "Which store to scrape (a store key, or 'all')"
        required: false
        default: "all"

# Never let two scrapes write to the DB at once (e.g. a manual run during the
# scheduled one). Queue instead of cancelling so an in-progress scrape finishes.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape ${{ github.event.inputs.store || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330 # under the 6h hard limit; a full all-stores run is ~2-3h
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        # The base scraper launches a browser even for API-based stores.
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python -m scrapers.runner --store "${{ github.event.inputs.store || 'all' }}"

      - name: Clean up stale listings
        # Drop StoreProducts not seen in STALE_DAYS (default 7) so delisted
        # products fall out of search. Safe: daily runs keep everything fresh.
        run: python -c "import asyncio; from scrapers.scheduler import cleanup_stale_listings; asyncio.run(cleanup_stale_listings())"
